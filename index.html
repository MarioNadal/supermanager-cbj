<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SuperManager CBJ">
<title>SuperManager CBJ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ── Tokens (idénticos a Kortline v3) ── */
:root{
  --navy:#0d2244;--navy2:#1a3a6b;--orange:#F06318;--orange2:#B83808;
  --orangeG:linear-gradient(135deg,#F06318,#B83808);
  --bg:#070f1e;--s:#0c1828;--s2:#111f34;--s3:#1a3050;--border:#1d3654;
  --tx:#eef2ff;--td:#7a9cc8;--tm:#3a5a80;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--gray:#6b7280;--sky:#38bdf8;
  --font-d:'Barlow Condensed',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;
  --r:12px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:var(--font-b);background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;background-image:radial-gradient(rgba(29,54,84,0.22) 1px,transparent 1px);background-size:24px 24px;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
input,select,textarea{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;}
#root{max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;}
/* ── Header ── */
.header{padding:13px 16px;background:rgba(6,12,24,0.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:calc(14px + env(safe-area-inset-top));}
.hrow{display:flex;align-items:center;gap:10px;}
.htitle{font-family:var(--font-d);font-weight:900;font-size:24px;letter-spacing:.5px;line-height:1;text-transform:uppercase;}
.hsub{font-size:11px;color:var(--td);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px;}
.hlogo{width:36px;height:36px;border-radius:9px;flex-shrink:0;}
.bbtn{background:var(--s2);border:1px solid var(--border);color:var(--tx);min-width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0 10px;font-weight:700;}
/* ── Nav ── */
.nav{display:flex;background:rgba(10,20,38,0.95);border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;border:none;background:transparent;color:var(--tm);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.nb.on{color:var(--orange);}
.nb .ni{font-size:20px;line-height:1.2;}
.content{padding:14px 16px 90px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
/* ── Tipografía / cajas ── */
.sval{font-family:var(--font-d);font-weight:900;font-size:38px;color:var(--orange);line-height:1;}
.slbl{font-size:10px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
.sbox{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px;}
.card{background:var(--s);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.accent{height:4px;background:var(--orangeG);}
.muted{color:var(--td);}
.tiny{font-size:11px;color:var(--td);}
.d{font-family:var(--font-d);font-weight:900;}
.up{color:var(--green);}.down{color:var(--red);}
.mvp{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1200;font-weight:900;font-size:10px;padding:2px 6px;border-radius:5px;letter-spacing:.5px;}
/* ── Botones / formularios (Kortline) ── */
.btn-p{width:100%;padding:13px;border:none;border-radius:9px;font-weight:800;font-size:15px;cursor:pointer;background:var(--orangeG);color:white;margin-top:4px;transition:opacity .15s;}
.btn-p:disabled{opacity:.4;cursor:not-allowed;}
.btn-s{width:100%;padding:13px;border:1px solid var(--border);border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;background:var(--s2);color:var(--td);margin-top:8px;}
.btn-d{width:100%;padding:13px;border:1px solid rgba(239,68,68,.4);border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;background:rgba(239,68,68,.1);color:var(--red);margin-top:8px;}
.btn-sm{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800;border:none;cursor:pointer;background:var(--orangeG);color:#fff;white-space:nowrap;}
.btn-sm.ghost{background:var(--s2);border:1px solid var(--border);color:var(--td);}
.btn-sm:disabled{opacity:.35;cursor:not-allowed;}
.fg{margin-bottom:13px;}
.fl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--tx);font-size:16px;outline:none;font-family:var(--font-b);min-height:44px;}
.fi:focus{border-color:var(--orange);}
.fi option{background:#0c1828;}
.frow{display:flex;gap:10px;}.frow>.fg{flex:1;min-width:0;}
.pnum{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:16px;flex-shrink:0;color:white;}
/* ── Chips / segmentado ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--s2);color:var(--td);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
.chip.on{background:rgba(240,99,24,.15);border-color:var(--orange);color:var(--orange);}
.seg{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:transparent;color:var(--td);font-weight:800;font-size:13px;padding:9px 6px;border-radius:8px;cursor:pointer;}
.seg button.on{background:var(--orangeG);color:#fff;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
.pill.g{background:rgba(34,197,94,.14);color:var(--green);}
.pill.a{background:rgba(245,158,11,.14);color:var(--amber);}
.pill.o{background:rgba(240,99,24,.15);color:var(--orange);}
.pill.n{background:var(--s3);color:var(--td);}
.tag{font-size:10px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:5px;}
/* ── Filas ── */
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.row:last-child{border-bottom:none;}
.row:active{background:var(--s2);}
.row.me{background:rgba(240,99,24,.08);box-shadow:inset 3px 0 0 var(--orange);}
.rmain{flex:1;min-width:0;}
.rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:11px;color:var(--td);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.rnum{text-align:right;flex-shrink:0;}
.rnum .v{font-family:var(--font-d);font-weight:900;font-size:19px;line-height:1;}
.rnum .l{font-size:10px;color:var(--td);font-weight:700;margin-top:2px;}
.rank{width:26px;text-align:center;font-family:var(--font-d);font-weight:900;font-size:18px;color:var(--td);flex-shrink:0;}
.rank.r1{color:#fbbf24;}.rank.r2{color:#cbd5e1;}.rank.r3{color:#d97706;}
/* ── Hero ── */
.hero{padding:16px;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hero-name{font-family:var(--font-d);font-weight:900;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
.kv .k{font-size:10px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
.kv .v{font-family:var(--font-d);font-weight:800;font-size:21px;margin-top:3px;}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px;border:1px solid;}
.banner.g{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#bbf7d0;}
.banner.a{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#fde68a;}
.banner.o{background:rgba(240,99,24,.08);border-color:rgba(240,99,24,.3);color:#fed7aa;}
.banner b{color:var(--tx);}
/* ── Barras ── */
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px 2px 0;}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
.bar .b{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--orangeG);min-height:3px;}
.bar .b.neg{background:var(--red);}
.bar .b.nj{background:var(--s3);}
.bar .bv{font-size:10px;font-weight:800;margin-bottom:3px;font-family:var(--font-d);}
.bar .bl{font-size:9.5px;color:var(--td);margin-top:4px;font-weight:700;}
/* ── Modales (Kortline) ── */
.ov{position:fixed;inset:0;background:rgba(3,8,18,.72);z-index:9999;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--s);border-radius:20px 20px 0 0;border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;z-index:10000;animation:up .28s ease;overscroll-behavior:none;}
@keyframes up{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
.mhandle{width:34px;height:4px;background:var(--s3);border-radius:2px;margin:-6px auto 14px;}
.mtitle{font-family:var(--font-d);font-weight:900;font-size:22px;margin-bottom:4px;letter-spacing:.5px;}
.msub{font-size:13px;color:var(--td);margin-bottom:14px;line-height:1.5;}
.ov.top{z-index:99998}.modal.top{z-index:99999}
/* ── Toast ── */
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--border);color:var(--tx);padding:11px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:100000;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;animation:fade .2s;}
.toast.err{border-color:rgba(239,68,68,.5);}
/* ── Login ── */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));}
.auth-logo{width:78px;height:78px;border-radius:20px;margin:0 auto 14px;display:block;box-shadow:0 10px 36px rgba(240,99,24,.35);}
.auth-t{font-family:var(--font-d);font-weight:900;font-size:38px;text-align:center;line-height:1;letter-spacing:.5px;}
.auth-t span{color:var(--orange);}
.auth-s{text-align:center;color:var(--td);font-size:13px;margin:8px 0 22px;}
.pin{letter-spacing:10px;font-family:var(--font-d);font-weight:800;font-size:22px;text-align:center;}
.demo{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#bae6fd;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:14px;}
/* ── Admin ── */
.arow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
.arow:last-child{border-bottom:none;}
.vin{width:74px;text-align:center;font-family:var(--font-d);font-weight:800;font-size:18px;padding:8px 6px;min-height:40px;}
.tgl{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.tgl .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.tgl.on .box{background:var(--orangeG);border-color:var(--orange);color:#fff;}
.empty{padding:26px 16px;text-align:center;color:var(--td);font-size:13px;line-height:1.6;}
.center{text-align:center;}
.mt8{margin-top:8px}.mt12{margin-top:12px}
/* ── v0.2: equipos y porra ── */
.tbadge{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:#fff;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);}
.tbadge .tb1{font-family:var(--font-d);font-weight:900;letter-spacing:.5px;}
.tbadge .tb2{font-family:var(--font-d);font-weight:800;opacity:.85;margin-top:1px;}
.tbadge.empty-b{width:40px;height:40px;background:transparent;border:1.5px dashed var(--border);color:var(--orange);font-size:20px;box-shadow:none;}
.row.cap{background:rgba(251,191,36,.06);box-shadow:inset 3px 0 0 #fbbf24;}
.capb{display:inline-block;background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1200;font-weight:900;font-size:9.5px;padding:2px 6px;border-radius:5px;letter-spacing:.5px;vertical-align:2px;margin-left:4px;}
.lnk{color:var(--orange);font-weight:800;text-decoration:underline;cursor:pointer;}
.pcard{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.picks.three{grid-template-columns:repeat(3,1fr);margin-top:6px;}
.picks.dim{opacity:.4;}
.pick{border:1px solid var(--border);background:var(--s2);color:var(--td);font-weight:800;font-size:13px;padding:10px 4px;border-radius:9px;cursor:pointer;min-height:42px;}
.pick:disabled{cursor:default;}
.pick.on{background:rgba(240,99,24,.16);border-color:var(--orange);color:var(--orange);}
.pick.w.on{background:rgba(34,197,94,.14);border-color:var(--green);color:var(--green);}
.pick.l.on{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red);}
.pick:focus-visible,.chip:focus-visible,.btn-p:focus-visible,.btn-s:focus-visible,.nb:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.fxrow{padding:10px 14px;border-bottom:1px solid var(--border);}
.fxrow:last-child{border-bottom:none;}
.rules{font-size:14px;color:var(--tx);line-height:1.65;}
.stars{color:#fbbf24;letter-spacing:1px;white-space:nowrap;}.stars .off{color:var(--s3);}
</style>
</head>
<body>
<div id="root"></div>
<div id="mroot"></div>

<!-- Firebase (solo se usa si FIREBASE_CONFIG está relleno) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   SUPERMANAGER CBJ — el juego de todo el Club Baloncesto Jaca
   Fantasy de EQUIPOS (no de jugadores) + porra de resultados.
   Ningún menor aparece puntuado: solo equipos y marcadores.
   ════════════════════════════════════════════════════════════════ */
const APP_VERSION = "0.2.0";

// ⚙️ Configuración del proyecto Firebase (Consola → Configuración del proyecto → Tus apps → Web).
// Si es null, la app funciona en MODO DEMO con datos ficticios guardados solo en este navegador.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCHkwRoR7kO169mDdUi8Jy2EwJagBliYfw",
  authDomain: "supermanager-cbj.firebaseapp.com",
  projectId: "supermanager-cbj",
  storageBucket: "supermanager-cbj.firebasestorage.app",
  messagingSenderId: "952499382475",
  appId: "1:952499382475:web:dfc25b623b803707a9134e"
};

const DEMO = !FIREBASE_CONFIG || typeof firebase === "undefined";
const CATS = {
  Senior:{ab:"SEN",color:"#F06318"}, Junior:{ab:"JUN",color:"#f59e0b"}, Cadete:{ab:"CAD",color:"#38bdf8"},
  Infantil:{ab:"INF",color:"#22c55e"}, Preinfantil:{ab:"PRE",color:"#a78bfa"}, "Alevín":{ab:"ALE",color:"#f472b6"},
  "Benjamín":{ab:"BEN",color:"#94a3b8"}
};
const CAT_ORDER = Object.keys(CATS);
const GENDERS = {M:"Masculino",F:"Femenino",X:"Mixto"};
const TRAMOS = {1:"1-5",2:"6-14",3:"15+"};
const DEFAULT_CFG = {season:"2026-27",jornada:0,mercado:"open",estrellas:10,plantilla:5,cambios:2,capMult:2,
  // Puntos del equipo según la diferencia final (nosotros − rival)
  puntos:[{min:15,pts:15},{min:6,pts:12},{min:1,pts:10},{min:0,pts:5},{min:-5,pts:4},{min:-14,pts:2},{min:-999,pts:0}],
  porraGanador:3, porraTramo:2};

/* ── Utilidades ── */
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const r1 = n => Math.round(n*10)/10;
const fmt1 = n => (Number.isInteger(n)? String(n) : r1(n).toFixed(1)).replace(".",",");
const starsTxt = n => "★".repeat(Math.max(0,n||0));
function starsHtml(n,size){ n=n||1; return `<span class="stars" style="${size?"font-size:"+size+"px":""}">${"★".repeat(n)}<span class="off">${"★".repeat(Math.max(0,3-n))}</span></span>`; }
const tramoOf = d => { const a=Math.abs(d); return a<=5?1:a<=14?2:3; };
function toast(msg,err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function teamPtsFor(diff){ for(const t of S.cfg.puntos) if(diff>=t.min) return t.pts; return 0; }
function tierLabel(i){
  const T=S.cfg.puntos, lo=T[i].min, hi=i===0?Infinity:T[i-1].min-1;
  if(lo>=1) return hi===Infinity?`Gana de ${lo} o más`:`Gana de ${lo} a ${hi}`;
  if(lo===0&&hi===0) return "Empate";
  if(hi<=-1) return lo<=-999?`Pierde de ${-hi} o más`:`Pierde de ${-hi} a ${-lo}`;
  return `Pierde de 1 a ${-lo}`;
}

/* ════════════════════════════════════════════════════════════════
   CAPA DE DATOS — misma interfaz para demo (localStorage) y Firebase
   ════════════════════════════════════════════════════════════════ */
function newManagerDoc(nick,teamName){
  return {name:nick.trim(),teamName:(teamName||"").trim()||("Los de "+nick.trim()),roster:[],captain:null,
          chg:{j:0,used:0},done:false,preds:{},total:0,byJ:{},byP:{},ageOk:true,createdAt:Date.now()};
}
function makeLocalDB(){
  const KEY="smcbj:demo:v2";
  let store=null; try{store=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  const fresh=!store;
  if(!store) store={teams:{},managers:{},jornadas:{},config:{},users:{}};
  let uid=null; try{uid=localStorage.getItem(KEY+":uid")||null;}catch(e){}
  const L={}; let authCb=null;
  const persist=()=>{ try{localStorage.setItem(KEY,JSON.stringify(store)); localStorage.setItem(KEY+":uid",uid||"");}catch(e){} };
  const list=col=>Object.entries(store[col]||{}).map(([id,d])=>Object.assign(clone(d),{id}));
  const emit=col=>(L[col]||[]).forEach(cb=>cb(list(col)));
  const api={
    demo:true, fresh,

        else store[o.col][o.id]= (o.merge||o.fields) ? Object.assign(store[o.col][o.id]||{},clone(o.data)) : clone(o.data); });
      persist(); [...new Set(ops.map(o=>o.col))].forEach(emit);
    },
    newId:()=> "t"+Math.random().toString(36).slice(2,10),
    reset(){ try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+":uid");}catch(e){} location.reload(); },
    auth:{

        uid=u.uid; persist(); authCb&&authCb({uid,admin:true});

function makeFirebaseDB(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore(), au=firebase.auth();
  const email=nick=>slug(nick)+"@supermanager-cbj.app";
  const pw=pin=>"cbjsm-"+pin;
  return {
    demo:false,
    listen(col,cb){
      const onErr=e=>{console.warn(col,e); toast("Error de conexión ("+col+")",true);};
      if(col==="config") return fs.collection("config").doc("game").onSnapshot(d=>cb(d.exists?[Object.assign(d.data(),{id:"game"})]:[]),onErr);
      return fs.collection(col).onSnapshot(s=>cb(s.docs.map(d=>Object.assign(d.data(),{id:d.id}))),onErr);
    },
    async batch(ops){
      for(let i=0;i<ops.length;i+=450){
        const b=fs.batch();
        ops.slice(i,i+450).forEach(o=>{ const r=fs.collection(o.col).doc(o.id);
          if(o.op==="del") b.delete(r); else b.set(r,o.data,o.fields?{mergeFields:o.fields}:o.merge?{merge:true}:{}); });
        await b.commit();
      }
    },
    newId:()=>fs.collection("teams").doc().id,
    setClubCode:code=>fs.collection("secret").doc("club").set({code:String(code).trim().toUpperCase()}),
    auth:{
      onChange(cb){ au.onAuthStateChanged(async u=>{ if(!u) return cb(null);
        let admin=false; try{ admin=(await fs.collection("admins").doc(u.uid).get()).exists; }catch(e){}
        cb({uid:u.uid,admin}); }); },
      async register({nick,pin,code,teamName}){
        if(!slug(nick)) throw new Error("Escribe un apodo");
        let cred;
        try{ cred=await au.createUserWithEmailAndPassword(email(nick),pw(pin)); }
        catch(e){ throw new Error(e.code==="auth/email-already-in-use"?"Ese apodo ya está cogido. Si es tuyo, entra con tu PIN.":"No se pudo crear la cuenta ("+(e.code||e.message)+")"); }
        const uid=cred.user.uid;
        try{ await fs.collection("joins").doc(uid).set({code:String(code).trim().toUpperCase(),at:Date.now()}); }
        catch(e){ await cred.user.delete().catch(()=>{}); throw new Error("Código del club incorrecto"); }
        await fs.collection("managers").doc(uid).set(newManagerDoc(nick,teamName));
      },
      async login({nick,pin}){
        try{ await au.signInWithEmailAndPassword(email(nick),pw(pin)); }
        catch(e){ throw new Error("Apodo o PIN incorrectos"); }
      },
      logout:()=>au.signOut()
    }
  };
}

function teamStats(t){
  const pts=Object.values(t.pts||{}).filter(v=>typeof v==="number");
  const n=pts.length, media=n?pts.reduce((a,v)=>a+v,0)/n:0;
  const res=Object.values(t.res||{}); const w=res.filter(r=>r.us>r.them).length;
  const lp=lastPub(); const last= lp&&typeof (t.pts||{})[lp.n]==="number" ? t.pts[lp.n] : null;
  return {n,media,last,w,l:res.filter(r=>r.us<r.them).length};
}
function ownersPct(tid){ const ms=Object.values(S.managers); return ms.length? ms.filter(m=>(m.roster||[]).includes(tid)).length/ms.length : 0; }
function rosterStars(roster){ return (roster||[]).reduce((a,id)=>a+(S.teams[id]?.stars||0),0); }
const starsLeft = m => S.cfg.estrellas - rosterStars(m.roster);
function changesInfo(m){
  if(!m.done || (S.cfg.jornada||0)===0) return {unlimited:true,left:Infinity,used:0};
  const used=(m.chg&&m.chg.j===jOpen())?m.chg.used:0;
  return {unlimited:false,left:Math.max(0,S.cfg.cambios-used),used};
}
function buyCheck(tid){
  const m=me(), t=S.teams[tid];
  if(!m||!t) return {ok:false,r:""};
  if((m.roster||[]).includes(tid)) return {ok:false,r:"Ya está en tu plantilla"};
  if(S.cfg.mercado!=="open") return {ok:false,r:"Mercado cerrado"};
  if(t.active===false) return {ok:false,r:"Equipo fuera del juego"};
  if((m.roster||[]).length>=S.cfg.plantilla) return {ok:false,r:"Ya tienes "+S.cfg.plantilla+" equipos: vende uno antes"};
  const left=starsLeft(m);
  if(left<t.stars) return {ok:false,r:(left===1?"Te queda 1 estrella":"Te quedan "+Math.max(0,left)+" estrellas")+" y cuesta "+t.stars};
  const ch=changesInfo(m); if(!ch.unlimited&&ch.left<=0) return {ok:false,r:"Ya has hecho tus "+S.cfg.cambios+" fichajes de esta jornada"};
  return {ok:true};
}
async function buy(tid){
  const c=buyCheck(tid); if(!c.ok){ toast(c.r,true); return; }
  const m=me(), t=S.teams[tid];
  const roster=[...(m.roster||[]),tid]; const patch={roster};
  const ch=changesInfo(m); if(!ch.unlimited) patch.chg={j:jOpen(),used:ch.used+1};
  if(!m.done && roster.length>=S.cfg.plantilla) patch.done=true;
  if(!m.captain) patch.captain=tid;
  await DB.batch([{op:"set",col:"managers",id:S.user.uid,data:patch,merge:true}]);
  closeModal(); toast("✅ "+t.name+" fichado"+(patch.captain?" (y es tu capitán)":""));
}
function sell(tid){
  const m=me(), t=S.teams[tid];
  if(S.cfg.mercado!=="open") return toast("Mercado cerrado",true);
  const ch=changesInfo(m);
  confirmModal("Vender "+esc(t.name),`Liberas <b>${t.stars} ${t.stars===1?"estrella":"estrellas"}</b>.${ch.unlimited?"":`<br><br>Vender es gratis, pero fichar al sustituto gasta 1 cambio (te quedan <b>${ch.left}</b>).`}${m.captain===tid?"<br><br>⚠️ Es tu capitán: tendrás que elegir otro.":""}`,"Vender",async()=>{
    const roster=(m.roster||[]).filter(x=>x!==tid);

}

async function setPred(tid,field,val){
  if(S.cfg.mercado!=="open") return toast("Mercado cerrado: pronósticos bloqueados",true);
  const m=me(); const J=String(jOpen());
  const preds=clone(m.preds||{}); preds[J]=preds[J]||{}; const p=preds[J][tid]=preds[J][tid]||{};
  if(p[field]===val) delete p[field]; else p[field]=val;
  if(field==="w"&&!p.w) delete p.t;
  if(!p.w&&!p.t) delete preds[J][tid];
  // limpiar jornadas antiguas: solo se guarda la abierta (las cerradas quedan en la jornada)
  Object.keys(preds).forEach(k=>{ if(k!==J) delete preds[k]; });
  await DB.batch([{op:"set",col:"managers",id:S.user.uid,data:{preds},fields:["preds"]}]);
}

function porraPts(pred,res){
  if(!pred||!pred.w||!res) return 0;
  const d=res.us-res.them; if(d===0) return 0;
  const win=d>0?"W":"L"; if(pred.w!==win) return 0;
  return S.cfg.porraGanador + (pred.t===tramoOf(d)?S.cfg.porraTramo:0);
}
function scoreJornada(jd,results){
  const tPts={};
  Object.entries(results).forEach(([tid,r])=>{ if(typeof r.us==="number"&&typeof r.them==="number") tPts[tid]=teamPtsFor(r.us-r.them); });
  const mPts={};
  const uids=new Set([...Object.keys(jd.lineups||{}),...Object.keys(jd.preds||{})]);
  uids.forEach(uid=>{
    const lu=(jd.lineups||{})[uid]||{roster:[],captain:null};
    let f=0; (lu.roster||[]).forEach(tid=>{ const p=tPts[tid]||0; f+= tid===lu.captain ? p*S.cfg.capMult : p; });
    let p=0; Object.entries((jd.preds||{})[uid]||{}).forEach(([tid,pr])=>{ p+=porraPts(pr,results[tid]); });
    mPts[uid]={f:r1(f),p,t:r1(f+p)};
  });
  return {tPts,mPts};
}

function publishOps(J,results){
  const jd=Object.assign({},S.jornadas[String(J)]||{}); delete jd.id;
  const {tPts,mPts}=scoreJornada(jd,results);
  const ops=[];
  Object.values(S.teams).forEach(t=>{
    if(!(t.id in tPts)) return;
    const d=Object.assign({},t); delete d.id;
    d.pts=Object.assign({},t.pts||{}); d.pts[J]=tPts[t.id];
    d.res=Object.assign({},t.res||{}); d.res[J]={us:results[t.id].us,them:results[t.id].them,rival:(jd.fixtures||{})[t.id]?.rival||""};
    ops.push({op:"set",col:"teams",id:t.id,data:d});
  });
  Object.entries(mPts).forEach(([uid,s])=>{
    const m=S.managers[uid]; if(!m) return;
    const byJ=Object.assign({},m.byJ||{}); byJ[J]=s.t;
    const byP=Object.assign({},m.byP||{}); byP[J]=s.p;
    ops.push({op:"set",col:"managers",id:uid,data:{byJ,byP,total:r1(Object.values(byJ).reduce((a,v)=>a+v,0))},merge:true});
  });
  ops.push({op:"set",col:"jornadas",id:String(J),data:Object.assign(jd,{n:J,status:"published",results,tPts,mPts,publishedAt:Date.now()})});
  ops.push({op:"set",col:"config",id:"game",data:{jornada:J,mercado:"open"},merge:true});
  return ops;
}
function undoPublishOps(){
  const J=S.cfg.jornada, jd=S.jornadas[String(J)];
  if(!jd||jd.status!=="published") return null;
  const ops=[];
  Object.values(S.teams).forEach(t=>{
    if(!t.pts||t.pts[J]==null) return;
    const d=Object.assign({},t); delete d.id;
    d.pts=Object.assign({},t.pts); delete d.pts[J]; d.res=Object.assign({},t.res||{}); delete d.res[J];
    ops.push({op:"set",col:"teams",id:t.id,data:d});
  });
  Object.entries(S.managers).forEach(([uid,m])=>{
    if(!m.byJ||m.byJ[J]==null) return;
    const d=Object.assign({},m); delete d.id;
    d.byJ=Object.assign({},m.byJ); delete d.byJ[J]; d.byP=Object.assign({},m.byP||{}); delete d.byP[J];
    d.total=r1(Object.values(d.byJ).reduce((a,v)=>a+v,0));
    ops.push({op:"set",col:"managers",id:uid,data:d});
  });
  const nj=Object.assign({},jd,{status:"closed"}); delete nj.id; delete nj.tPts; delete nj.mPts; delete nj.publishedAt;
  ops.push({op:"set",col:"jornadas",id:String(J),data:nj});
  ops.push({op:"set",col:"config",id:"game",data:{jornada:J-1,mercado:"closed"},merge:true});
  return ops;
}
function ranking(j,kind){
  const val=m=> kind==="porra" ? Object.values(m.byP||{}).reduce((a,v)=>a+v,0) : j ? (m.byJ||{})[j] : (m.total||0);
  const arr=Object.entries(S.managers).map(([uid,m])=>({uid,m,pts:val(m)})).filter(x=>typeof x.pts==="number");
  arr.sort((a,b)=>b.pts-a.pts||a.m.name.localeCompare(b.m.name));
  let lp=null,lr=0; arr.forEach((x,i)=>{ if(x.pts!==lp){lr=i+1;lp=x.pts;} x.rank=lr; });
  return arr;
}
function suggestStars(t){
  const pool=activeTeams().map(x=>({id:x.id,...teamStats(x)})).filter(x=>x.n>=2).sort((a,b)=>a.media-b.media);
  const i=pool.findIndex(x=>x.id===t.id); if(i<0||pool.length<6) return null;
  const q=i/(pool.length-1); return q<1/3?1:q<2/3?2:3;
}

async function doAuth(){
  const reg=S.authTab==="reg";
  const nick=$("a_nick").value.trim(), pin=$("a_pin").value.trim();
  if(nick.length<3) return toast("El apodo necesita al menos 3 letras",true);
  if(!/^\d{4}$/.test(pin)) return toast("El PIN son 4 cifras",true);
  if(reg&&!$("a_age").classList.contains("on")) return toast("Marca la casilla de edad para continuar",true);
  const btn=$("a_btn"); btn.disabled=true;
  try{
    if(reg) await DB.auth.register({nick,pin,code:$("a_code").value,teamName:$("a_team").value});
    else await DB.auth.login({nick,pin});
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}

/* ── Porra ── */
function porraScreen(){
  const m=me(); const open=S.cfg.mercado==="open"; const J=jOpen(); const jd=curJ();
  const fx=Object.entries(jd?.fixtures||{}).filter(([tid])=>S.teams[tid]).sort((a,b)=>teamSort(S.teams[a[0]],S.teams[b[0]]));
  const mine = open ? ((m.preds||{})[String(J)]||{}) : ((jd?.preds||{})[S.user.uid]||{});
  const lp=lastPub(); const lpPreds=lp&&(lp.preds||{})[S.user.uid]||{};
  const done=fx.filter(([tid])=>mine[tid]&&mine[tid].w).length;
  const card=([tid,f])=>{ const t=S.teams[tid]; const p=mine[tid]||{};
    const b=(fld,val,lbl)=>`<button class="pick ${p[fld]===val?"on":""} ${fld==="w"?(val==="W"?"w":"l"):""}" ${open?`onclick="setPred('${tid}','${fld}',${typeof val==="string"?`'${val}'`:val})"`:"disabled"}>${lbl}</button>`;
    return `<div class="pcard">
      <div class="prow">${tbadge(t,36)}<div class="rmain"><div class="rname">${esc(t.name)}</div><div class="rsub">${f.home===false?"@":"vs"} <b style="color:var(--tx)">${esc(f.rival||"Rival")}</b>${f.when?" · "+esc(f.when):""}</div></div>
        ${p.w?`<span class="pill ${p.t?"g":"o"}">${p.t?"✓":"½"}</span>`:""}</div>
      <div class="picks">${b("w","W","Gana CBJ")}${b("w","L","Pierde CBJ")}</div>
      <div class="picks three ${p.w?"":"dim"}">${[1,2,3].map(k=>b("t",k,"Por "+TRAMOS[k])).join("")}</div>
    </div>`; };
  const lastBlock = lp ? (()=>{ const rows=Object.entries(lp.results||{}).filter(([tid])=>S.teams[tid]).sort((a,b)=>teamSort(S.teams[a[0]],S.teams[b[0]]));
    const tot=(lp.mPts&&lp.mPts[S.user.uid]||{}).p||0;
    return `<div class="sec"><span>Tu porra de la J${lp.n}</span><span class="pill o">${tot} pts</span></div><div class="card">${rows.map(([tid,r])=>{ const t=S.teams[tid]; const pr=lpPreds[tid]; const pts=porraPts(pr,r); const d=r.us-r.them;
      return `<div class="arow">${tbadge(t,32)}<div class="rmain"><div class="rname" style="font-size:13px">${esc(t.name)}</div><div class="rsub">${pr&&pr.w?`Dijiste: ${pr.w==="W"?"gana":"pierde"}${pr.t?" por "+TRAMOS[pr.t]:""}`:"Sin pronóstico"}</div></div>
        <div class="d ${d>0?"up":d<0?"down":""}" style="font-size:17px">${r.us}-${r.them}</div><div class="rnum" style="min-width:36px"><div class="v ${pts?"":"muted"}">${pts?"+"+pts:"0"}</div></div></div>`; }).join("")}</div>`; })() : "";
  return header("Porra",`Jornada ${J} · ${open?done+" de "+fx.length+" pronosticados":"pronósticos cerrados"}`)+
  `<div class="content">
    ${marketBanner()}
    <div class="tiny" style="margin:-2px 2px 12px;line-height:1.5">Acertar quién gana: <b style="color:var(--tx)">+${S.cfg.porraGanador}</b>. Acertar además la diferencia: <b style="color:var(--tx)">+${S.cfg.porraTramo}</b>.</div>
    ${fx.length?fx.map(card).join(""):`<div class="card"><div class="empty">El club todavía no ha publicado los partidos de la jornada ${J}.</div></div>`}
    ${lastBlock}
  </div>`;
}

  const txt=`🏀 *SuperManager CBJ* · Clasificación${lp?" tras la J"+lp.n:""}\n\n`+rk.map(x=>`${x.rank===1?"🥇":x.rank===2?"🥈":x.rank===3?"🥉":x.rank+"."} ${x.m.teamName} (@${x.m.name}) — ${fmt1(x.pts||0)}`).join("\n");
  try{ await navigator.clipboard.writeText(txt); toast("📋 Copiado: pégalo en WhatsApp"); }
  catch(e){ openModal(`<div class="mtitle">Copiar clasificación</div><textarea class="fi" style="height:260px;font-size:13px" onfocus="this.select()">${esc(txt)}</textarea><button class="btn-s" onclick="closeModal()">Cerrar</button>`); }
}

/* ════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════ */
function adminScreen(){
  if(!isAdmin()) return header("Admin")+`<div class="content"><div class="empty">Sin permisos.</div></div>`;
  const tabs=[["jornada","Jornada"],["equipos","Equipos"],["usuarios","Mánagers"],["ajustes","Ajustes"]];
  const body={jornada:admJornada,equipos:admEquipos,usuarios:admUsuarios,ajustes:admAjustes}[S.adm.sec]();
  return header("Panel admin",DEMO?"Modo demo":"Solo visible para admins")+
  `<div class="content"><div class="chips" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button class="chip ${S.adm.sec===k?"on":""}" onclick="S.adm.sec='${k}';render()">${l}</button>`).join("")}</div>${body}</div>`;
}
function admJornada(){
  const J=jOpen(), open=S.cfg.mercado==="open", jd=curJ()||{}; const lp=lastPub();
  const teams=activeTeams();
  if(open){
    if(!S.adm.fx||S.adm.fx.J!==J) S.adm.fx={J,fx:clone(jd.fixtures||{})};
    const fx=S.adm.fx.fx; const n=Object.keys(fx).length;
    return `<div class="banner g">🟢 <div><b>Jornada ${J} · mercado abierto.</b> 1) Mete los partidos del finde para que la gente haga la porra. 2) Cierra el mercado antes del primer partido.</div></div>
      <div class="sec"><span>Partidos de la J${J}</span><span class="muted" style="text-transform:none;letter-spacing:0">${n} de ${teams.length} juegan</span></div>
      <div class="card">${teams.map(t=>{ const f=fx[t.id];
        return `<div class="fxrow"><div class="arow" style="border:none;padding:0">${tbadge(t,32)}<div class="rmain"><div class="rname" style="font-size:13px">${esc(t.name)}</div></div>
          <div class="tgl ${f?"on":""}" style="padding:0" onclick="admFxToggle('${t.id}')"><div class="box">${f?"✓":""}</div><span class="tiny">Juega</span></div></div>
          ${f?`<div class="frow" style="margin-top:8px;gap:6px"><input class="fi" id="fx_r_${t.id}" style="flex:2;min-width:0;font-size:14px;min-height:38px;padding:8px 10px" placeholder="Rival" value="${esc(f.rival||"")}" onchange="S.adm.fx.fx['${t.id}'].rival=this.value.trim()">
            <input class="fi" id="fx_w_${t.id}" style="flex:1.3;min-width:0;font-size:14px;min-height:38px;padding:8px 10px" placeholder="Sáb 11:00" value="${esc(f.when||"")}" onchange="S.adm.fx.fx['${t.id}'].when=this.value.trim()">
            <button class="btn-sm ${f.home===false?"ghost":""}" style="min-width:58px" onclick="S.adm.fx.fx['${t.id}'].home=!(S.adm.fx.fx['${t.id}'].home!==false);render()">${f.home===false?"Fuera":"Casa"}</button></div>`:""}
        </div>`; }).join("")||`<div class="empty">Da de alta los equipos primero.</div>`}</div>
      <button class="btn-s" onclick="admSaveFx()">💾 Guardar partidos (se ven en la porra)</button>
      <button class="btn-p mt8" onclick="admCloseMarket()">🔒 Cerrar mercado de la J${J}</button>
      ${lp?`<button class="btn-s" onclick="admUndo()">↩️ Deshacer publicación de la J${lp.n}</button>`:""}`;
  }
  if(!S.adm.draft||S.adm.draft.J!==J) S.adm.draft={J,results:clone(jd.results||{})};
  const d=S.adm.draft; const fxT=Object.keys(jd.fixtures||{}).filter(tid=>S.teams[tid]).sort((a,b)=>teamSort(S.teams[a],S.teams[b]));
  return `<div class="banner a">🔒 <div><b>Mercado cerrado · J${J}.</b> ${Object.keys(jd.lineups||{}).length} plantillas y ${Object.keys(jd.preds||{}).length} porras fijadas. Mete los marcadores (de Swish o del acta) y publica.</div></div>
    <div class="card">${fxT.map(tid=>{ const t=S.teams[tid]; const f=jd.fixtures[tid]; const r=d.results[tid]||{};
      return `<div class="arow">${tbadge(t,32)}<div class="rmain"><div class="rname" style="font-size:13px">${esc(t.name)}</div><div class="rsub" id="rp_${tid}">${admResTxt(tid)}</div></div>
        <input class="fi vin" id="r_us_${tid}" inputmode="numeric" placeholder="CBJ" value="${r.us??""}" onchange="admRes('${tid}','us',this.value)">
        <span class="muted">–</span>
        <input class="fi vin" id="r_th_${tid}" inputmode="numeric" placeholder="${esc((f.rival||"Rival").slice(0,6))}" value="${r.them??""}" onchange="admRes('${tid}','them',this.value)"></div>`; }).join("")||`<div class="empty">No marcaste partidos para esta jornada.</div>`}</div>
    <button class="btn-s" onclick="admSaveDraft()">💾 Guardar borrador</button>
    <button class="btn-p mt8" onclick="admPublish()">🚀 Publicar J${J} y reabrir mercado</button>
    <button class="btn-s" onclick="admReopen()">Reabrir mercado sin publicar</button>`;
}
function admFxToggle(tid){ const fx=S.adm.fx.fx; if(fx[tid]) delete fx[tid]; else fx[tid]={rival:"",when:"",home:true}; render(); }
async function admSaveFx(){
  const J=jOpen(); await DB.batch([{op:"set",col:"jornadas",id:String(J),data:{n:J,status:"open",fixtures:S.adm.fx.fx},fields:["n","status","fixtures"]}]); toast("💾 Partidos guardados");
}
function admResTxt(tid){ const r=S.adm.draft.results[tid]; if(!r||typeof r.us!=="number"||typeof r.them!=="number") return "Sin marcador"; const d=r.us-r.them; return (d>0?"Gana de "+d:d<0?"Pierde de "+(-d):"Empate")+" → "+teamPtsFor(d)+" pts"; }
function admRes(tid,k,raw){
  const r=S.adm.draft.results[tid]=S.adm.draft.results[tid]||{}; const v=String(raw).trim();
  if(v===""){ delete r[k]; } else { const n=parseInt(v,10); if(!(n>=0&&n<250)) return toast("Marcador no válido",true); r[k]=n; }
  const el=$("rp_"+tid); if(el) el.textContent=admResTxt(tid);
}
function admCloseMarket(){
  const J=jOpen(); const nFx=Object.keys(S.adm.fx?.fx||curJ()?.fixtures||{}).length;
  confirmModal("Cerrar mercado J"+J,`Se fijan las plantillas, capitanes y porras de los ${Object.keys(S.managers).length} mánagers.${nFx?"":"<br><br>⚠️ No has marcado ningún partido: la porra quedará vacía."}`,"Cerrar mercado",async()=>{
    if(S.adm.fx&&S.adm.fx.J===J) await DB.batch([{op:"set",col:"jornadas",id:String(J),data:{n:J,fixtures:S.adm.fx.fx},fields:["n","fixtures"]}]);
    await DB.batch(closeMarketOps()); toast("🔒 Mercado cerrado");
  });
}
async function admSaveDraft(){ const d=S.adm.draft; await DB.batch([{op:"set",col:"jornadas",id:String(d.J),data:{results:d.results},fields:["results"]}]); toast("💾 Borrador guardado"); }
function admPublish(){
  const d=S.adm.draft; const jd=curJ()||{};
  const full=Object.entries(d.results).filter(([,r])=>typeof r.us==="number"&&typeof r.them==="number");
  if(!full.length) return toast("Mete al menos un marcador completo",true);
  const missing=Object.keys(jd.fixtures||{}).filter(tid=>!full.find(([k])=>k===tid)).map(tid=>S.teams[tid]?.name).filter(Boolean);
  const results=Object.fromEntries(full);
  confirmModal("Publicar jornada "+d.J,`${full.length} resultados. Se suman puntos de equipos y porra y se reabre el mercado.${missing.length?`<br><br>⚠️ Sin marcador (puntuarán 0): ${missing.map(esc).join(", ")}.`:""}<br><br>Si te equivocas, puedes deshacerlo.`,"Publicar",async()=>{
    await DB.batch(publishOps(d.J,results)); S.adm.draft=null; S.adm.fx=null; toast("🚀 Jornada "+d.J+" publicada");
  });
}
function admReopen(){
  confirmModal("Reabrir mercado","Se descartan las plantillas y porras fijadas (se volverán a fijar al cerrar). Los partidos y marcadores se conservan.","Reabrir",async()=>{
    await admSaveDraft(); await DB.batch(reopenMarketOps()); toast("Mercado reabierto");
  });
}
function admUndo(){
  const J=S.cfg.jornada;
  confirmModal("Deshacer J"+J,"Se restan los puntos de esa jornada y el mercado vuelve a quedar cerrado con las plantillas y porras de entonces, para que corrijas marcadores y vuelvas a publicar.<br><br>⚠️ Los fichajes hechos desde la publicación se mantienen.","Deshacer",async()=>{
    const ops=undoPublishOps(); if(!ops) return toast("Nada que deshacer",true);
    await DB.batch(ops); S.adm.draft=null; toast("↩️ J"+J+" deshecha");
  },true);
}
function admEquipos(){
  const ts=Object.values(S.teams).sort(teamSort);
  const nSug=ts.filter(t=>{const sg=suggestStars(t); return sg&&sg!==t.stars;}).length;
  return `<button class="btn-p" onclick="admTeamModal()">＋ Añadir equipo</button>
    ${nSug?`<button class="btn-s" onclick="admApplySuggest()">⭐ Revisar estrellas según resultados (${nSug} cambios)</button>`:""}
    <div class="sec">${ts.length} equipos</div>
    <div class="card">${ts.map(t=>`<div class="row" onclick="admTeamModal('${t.id}')">${tbadge(t)}<div class="rmain"><div class="rname">${esc(t.name)}</div><div class="rsub">${starsHtml(t.stars,12)} ${t.active===false?'<span class="pill n">Fuera del juego</span>':""}</div></div><div class="rnum"><div class="l">${Math.round(ownersPct(t.id)*100)}% lo tienen</div></div></div>`).join("")||`<div class="empty">Da de alta los equipos del club.</div>`}</div>`;
}
function admTeamModal(tid){
  const t=tid?S.teams[tid]:{cat:"Cadete",gender:"M",suffix:"",stars:2,active:true};
  const sel=(id,opts,v)=>`<select class="fi" id="${id}">${opts.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${l}</option>`).join("")}</select>`;

      <div class="fg"><label class="fl" for="tm_gen">Género</label>${sel("tm_gen",Object.entries(GENDERS),t.gender)}</div></div>
    <div class="frow"><div class="fg"><label class="fl" for="tm_suf">Letra (si hay varios)</label><input class="fi" id="tm_suf" maxlength="3" placeholder="A, B…" value="${esc(t.suffix||"")}"></div>
      <div class="fg"><label class="fl" for="tm_stars">Estrellas</label>${sel("tm_stars",[[1,"★ (1)"],[2,"★★ (2)"],[3,"★★★ (3)"]],t.stars)}</div></div>

    <button class="btn-p" onclick="admSaveTeam(${tid?`'${tid}'`:"null"})">Guardar</button>
    ${tid&&ownersPct(tid)===0&&!Object.keys(t.pts||{}).length?`<button class="btn-d" onclick="admDelTeam('${tid}')">Eliminar</button>`:""}
    <button class="btn-s" onclick="closeModal()">Cancelar</button>`);

async function admSaveTeam(tid){
  const cat=$("tm_cat").value, gender=$("tm_gen").value, suffix=$("tm_suf").value.trim().toUpperCase();
  const name=`${cat} ${GENDERS[gender]}${suffix?" "+suffix:""}`;
  if(Object.values(S.teams).some(x=>x.id!==tid&&x.name===name)) return toast("Ya existe "+name+": ponle una letra",true);
  const base=tid?Object.assign({},S.teams[tid]):{pts:{},res:{}}; delete base.id;
  Object.assign(base,{cat,gender,suffix,name,stars:Number($("tm_stars").value),active: tid?$("tm_act").classList.contains("on"):true});
  await DB.batch([{op:"set",col:"teams",id:tid||DB.newId(),data:base}]); closeModal(); toast("Guardado");
}
function admDelTeam(tid){ confirmModal("Eliminar equipo","Nadie lo tiene y no tiene resultados.","Eliminar",async()=>{ await DB.batch([{op:"del",col:"teams",id:tid}]); closeModal(); toast("Eliminado"); },true); }
function admApplySuggest(){
  const ch=activeTeams().map(t=>({t,sg:suggestStars(t)})).filter(x=>x.sg&&x.sg!==x.t.stars);
  confirmModal("Revisar estrellas",ch.map(x=>`${esc(x.t.name)}: ${starsTxt(x.t.stars)} → <b>${starsTxt(x.sg)}</b>`).join("<br>")+"<br><br>Quien ya los tenga los conserva.","Aplicar",async()=>{
    await DB.batch(ch.map(x=>({op:"set",col:"teams",id:x.t.id,data:{stars:x.sg},merge:true}))); toast("⭐ Estrellas actualizadas");

function admUsuarios(){
  const rk=ranking();
  return `<div class="sec">${rk.length} mánagers</div><div class="card">${rk.map(x=>`<div class="row"><div class="rank">${x.rank}</div><div class="rmain"><div class="rname">${esc(x.m.teamName)}</div><div class="rsub">@${esc(x.m.name)} · ${(x.m.roster||[]).length}/${S.cfg.plantilla} equipos · ${rosterStars(x.m.roster)}/${S.cfg.estrellas} ★</div></div><button class="btn-sm ghost" onclick="admDelManager('${x.uid}')">Quitar</button></div>`).join("")||`<div class="empty">Nadie todavía. Comparte el enlace y el código.</div>`}</div>`;

function admDelManager(uid){

  confirmModal("Quitar a @"+esc(m.name),"Se borra su cuenta del juego y sus puntos. No se puede deshacer.","Quitar",async()=>{ await DB.batch([{op:"del",col:"managers",id:uid}]); toast("Quitado"); },true);

function admAjustes(){
  const c=S.cfg;
  return `<div class="card" style="padding:16px">
    <div class="frow"><div class="fg"><label class="fl" for="cf_season">Temporada</label><input class="fi" id="cf_season" value="${esc(c.season)}"></div>
      <div class="fg"><label class="fl" for="cf_est">Estrellas</label><input class="fi" id="cf_est" inputmode="numeric" value="${c.estrellas}"></div></div>

async function admSaveCfg(){
  const n=id=>Number(String($(id).value).replace(",","."));
  const puntos=S.cfg.puntos.map((t,i)=>({min:t.min,pts:n("cf_p"+i)}));
  const data={season:$("cf_season").value.trim()||S.cfg.season,estrellas:Math.round(n("cf_est")),plantilla:Math.round(n("cf_pl")),cambios:Math.round(n("cf_cam")),
    capMult:n("cf_cap"),porraGanador:n("cf_pg"),porraTramo:n("cf_pt"),puntos};
  if(!(data.plantilla>=1&&data.plantilla<=8&&data.estrellas>=data.plantilla&&data.cambios>=0&&data.capMult>=1&&puntos.every(p=>p.pts>=0))) return toast("Revisa los valores",true);
  await DB.batch([{op:"set",col:"config",id:"game",data,merge:true}]); toast("Ajustes guardados");
}
async function admSetCode(){
  const v=$("cf_code").value.trim(); if(v.length<4) return toast("Mínimo 4 caracteres",true);
  try{ await DB.setClubCode(v); toast("Código cambiado"); $("cf_code").value=""; }catch(e){ toast("Error: "+e.message,true); }
}

/* ════════════════════════════════════════════════════════════════
   DATOS DE DEMO (equipos genéricos, mánagers y resultados ficticios)
   ════════════════════════════════════════════════════════════════ */
async function seedDemo(){
  let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const T=[["Senior","M","",3],["Junior","M","",3],["Cadete","M","",2],["Cadete","F","",2],["Infantil","M","",2],["Infantil","F","",1],["Preinfantil","M","",1],["Preinfantil","F","",1],["Alevín","M","",1],["Alevín","F","",1]];
  const rivals=["CB Huesca","Monzón","Barbastro","Fraga","Sabiñánigo","Stadium Casablanca","CN Helios","Almozara","Tarazona","Ejea","Alcañiz","El Olivar"];
  const ops=[]; const ids=[];
  T.forEach(([cat,g,suf,stars],i)=>{ const id="team"+i; ids.push({id,str:stars*6+rnd()*6});
    ops.push({op:"set",col:"teams",id,data:{cat,gender:g,suffix:suf,name:`${cat} ${GENDERS[g]}`,stars,pts:{},res:{},active:true}}); });
  ops.push({op:"set",col:"config",id:"game",data:clone(DEFAULT_CFG)});
  const mans=[["carmen_r","Los del Rapitán"],["jorgeM","Canfranc Ballers"],["pili","Triple de Oroel"],["fercebo","Peña Oroel BC"],["anapal","Ciudadela Squad"],["raul8","Pirineo Tres"],["bea_s","Las del Pabellón"],["dlatas","Aragón Dunk"],["silviac","Mate Jacetano"],["tomasU","Zona 2-3"],["rocioF","Bocina Final"],["andres_o","Tapón y Contra"]];
  mans.forEach(([n,t],k)=>{
    const pool=ids.map(x=>x.id).sort(()=>rnd()-.5); const pick=[]; let left=DEFAULT_CFG.estrellas;
    for(const id of pool){ if(pick.length>=5) break; const s=ops.find(o=>o.id===id).data.stars; if(s<=left-(5-pick.length-1)){ pick.push(id); left-=s; } }
    ops.push({op:"set",col:"managers",id:"demo_m"+k,data:Object.assign(newManagerDoc(n,t),{roster:pick,captain:pick[Math.floor(rnd()*pick.length)]||null,done:pick.length===5})});
  });
  await DB.batch(ops);
  for(let J=1;J<=4;J++){
    const fixtures={}; ids.forEach((x,i)=>{ if(rnd()<0.85) fixtures[x.id]={rival:rivals[Math.floor(rnd()*rivals.length)],when:(rnd()<.5?"Sáb ":"Dom ")+(9+Math.floor(rnd()*9))+":00",home:rnd()<.5}; });
    await DB.batch([{op:"set",col:"jornadas",id:String(J),data:{n:J,status:"open",fixtures}}]);
    if(J===4) break; // la J4 queda abierta con partidos para probar la porra
    const mset=[];
    Object.keys(S.managers).forEach(uid=>{ const preds={}; Object.keys(fixtures).forEach(tid=>{ if(rnd()<.8) preds[tid]={w:rnd()<.6?"W":"L",t:1+Math.floor(rnd()*3)}; }); const pp={}; pp[String(J)]=preds; mset.push({op:"set",col:"managers",id:uid,data:{preds:pp},merge:true}); });
    await DB.batch(mset);
    await DB.batch(closeMarketOps());
    const results={}; ids.forEach(x=>{ if(!fixtures[x.id]) return; const us=35+Math.round(x.str*1.2+rnd()*30), them=40+Math.round(rnd()*38); results[x.id]={us,them:them===us?them+1:them}; });
    await DB.batch(publishOps(J,results));
  }
}

/* ════════════════════════════════════════════════════════════════
   ARRANQUE
   ════════════════════════════════════════════════════════════════ */
(async function boot(){
  if(DEMO){ startListeners(); if(DB.fresh) await seedDemo(); }
  DB.auth.onChange(u=>{
    const prev=S.user&&S.user.uid; S.user=u;
    if(!DEMO){ if(u&&u.uid!==prev) startListeners(); if(!u) stopListeners(); }
    if(u&&S.tab==="admin"&&!u.admin) S.tab="equipo";
    closeModal(); render();
  });
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
